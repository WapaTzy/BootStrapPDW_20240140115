<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Toreno Coffee - Kritik & Saran</title>
</head>
<body class="d-flex flex-column min-vh-100">
    
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="Images/Logo.png" alt="Logo Toreno Coffee" width="120" class="d-inline-block align-text-top">
        </a>

    
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="Menu.html">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="contact.html">Kritik & Saran</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    

    
    <section class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h2 class="text-center mb-4 fw-bold">Hubungi Kami</h2>
                <div class="card shadow-sm p-4">
                    <form>
                        <div class="mb-3">
                            <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="namaLengkap" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailAlamat" class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" id="emailAlamat" placeholder="nama@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="pesan" class="form-label">Pesan / Saran</label>
                            <textarea class="form-control" id="pesan" rows="4" placeholder="Tulis pesan Anda di sini" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

  
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Toreno Coffee. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
