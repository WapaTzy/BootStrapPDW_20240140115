<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Toreno Coffee - Home</title>
    <style>
        
        :root {
            --coffee-gold: #c0a080;
            --coffee-dark: #2c1e12;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff; 
            color: #333;
        }

       
        .hero-title {
            font-family: 'Playfair Display', serif; 
            font-weight: 700;
            font-size: 5rem;
            letter-spacing: -1px;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.3);
        }

       
        .navbar {
            border-bottom: 1px solid #eee;
        }

       
        .btn-warning {
            background-color: var(--coffee-gold) !important;
            border: none !important;
            color: white !important;
            padding: 12px 35px;
            font-weight: 600;
            border-radius: 50px; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(192, 160, 128, 0.3);
        }

        .btn-warning:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(192, 160, 128, 0.4);
        }

     
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--coffee-dark);
            margin-bottom: 1.5rem;
        }

        .ratio-16x9 {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0 !important;
        }

        .social-card {
            background: #fdfdfd;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #f1f1f1;
        }
    </style>
</head>
<body>
    
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="Images/Logo.png" alt="Logo Toreno Coffee" width="120" class="d-inline-block align-text-top">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="Menu.html">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="contact.html">Kritik & Saran</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    
<header class="bg-secondary text-white text-center py-5" style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('Images/kopi-saya.jpg') center/cover;">
    <div class="container py-5">
        <h1 class="hero-title">Toreno Coffee</h1>
        <p class="lead mb-4 fs-4">Easy Pace and Good Taste.</p>
        <a href="menu.html" class="btn btn-warning btn-lg">Lihat Menu Kami</a>
    </div>
</header>

<section class="container py-5 my-5">
    <div class="row align-items-center g-5">
        
        
        <div class="col-lg-7">
            <h2 class="section-title">Kunjungi Kami</h2>
            <div class="ratio ratio-16x9 shadow-sm rounded overflow-hidden border">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d872.238290312683!2d110.16162151745408!3d-7.857753549646536!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e7afb00620f9155%3A0x3274b1eb8cc210c2!2sToreno%20Coffee!5e0!3m2!1sid!2sid!4v1714657200000!5m2!1sid!2sid" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>

      
        <div class="col-lg-5">
            <div class="social-card">
                <h2 class="section-title">Sosial Media Kami</h2>
                <p class="text-muted mb-4">Jangan sampai ketinggalan promo menarik dan menu baru dari Toreno Coffee.</p>

                <div class="d-grid gap-3">
                    <a href="https://www.instagram.com/torenocoffee.id?igsh=dXdrcnZxMjU0cGVi" target="_blank" class="btn btn-outline-danger btn-lg d-flex align-items-center justify-content-center gap-2 rounded-pill">
                        <i class="bi bi-instagram"></i> Instagram
                    </a>
                    <a href="https://www.tiktok.com/@torenocoffee.id?_r=1&_t=ZS-961i7NqCkZY" target="_blank" class="btn btn-dark btn-lg d-flex align-items-center justify-content-center gap-2 rounded-pill">
                        <i class="bi bi-tiktok"></i> TikTok
                    </a>
                </div>
            </div>
        </div>
        
    </div>
</section>
  
<footer class="bg-dark text-white text-center py-4">
    <div class="container">
        <p class="mb-0 opacity-75">&copy; 2026 Toreno Coffee. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
